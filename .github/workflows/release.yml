name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip pushes that do not change the binary
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # bench fixtures, Markdown, docs and workflows are not built into the binary; engines.json is.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER" | grep -vE '^bench/fixtures/|\.md$|^docs/|^\.github/' || true)
          if [ -z "$changed" ]; then
            echo "only fixtures, docs or workflows changed; no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag and release
        if: steps.changes.outputs.release != 'false'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: .github/release.sh "$BUMP"
